[project]
name = "kipris-mcp-server"
version = "0.1.0"
description = "KIPRIS Plus 특허 검색 MCP 서버 (Streamable HTTP + Bearer 토큰 인증)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
